<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIFA ワールドカップ2026 選手名鑑 | World Cup 2026 Player Almanac</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --panel2: #1c2230;
    --border: #2a3340;
    --text: #e6edf3;
    --muted: #9aa7b4;
    --accent: #3fb6ff;
    --accent2: #ffd84d;
    --gk: #f2994a; --df: #56ccf2; --mf: #6fcf97; --fw: #eb5757;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP",
      system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.6;
  }
  header.hero {
    padding: 28px 20px 20px; text-align: center;
    background: radial-gradient(1200px 300px at 50% -50%, #1d3b5a 0%, transparent 70%), var(--panel);
    border-bottom: 1px solid var(--border);
  }
  header.hero h1 { margin: 0 0 4px; font-size: clamp(20px, 4vw, 30px); letter-spacing: .5px; }
  header.hero .sub { color: var(--muted); font-size: 13px; }
  header.hero .meta { margin-top: 8px; font-size: 12px; color: var(--muted); }
  .disclaimer {
    max-width: 1100px; margin: 12px auto 0; font-size: 11.5px; color: #d9b54a;
    background: rgba(255,216,77,.07); border: 1px solid rgba(255,216,77,.25);
    border-radius: 10px; padding: 8px 12px; text-align: left;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 18px 16px 60px; }

  /* Controls */
  .controls {
    position: sticky; top: 0; z-index: 20; background: rgba(13,17,23,.92);
    backdrop-filter: blur(8px); padding: 14px 0; margin-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }
  .controls .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  #search {
    flex: 1 1 240px; min-width: 200px; padding: 10px 14px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--panel2); color: var(--text); font-size: 14px;
  }
  #search:focus { outline: none; border-color: var(--accent); }
  select {
    padding: 9px 12px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--panel2); color: var(--text); font-size: 13px;
  }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .chip {
    padding: 5px 11px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--panel2); color: var(--muted); font-size: 12px; cursor: pointer; user-select: none;
  }
  .chip.active { background: var(--accent); color: #07222f; border-color: var(--accent); font-weight: 700; }
  .stat-line { color: var(--muted); font-size: 12.5px; margin: 10px 2px 4px; }

  /* Team sections */
  .team { margin: 26px 0; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; background: var(--panel); }
  .team-head {
    display: flex; align-items: center; gap: 14px; padding: 14px 18px; cursor: pointer;
    background: linear-gradient(90deg, var(--panel2), var(--panel));
  }
  .team-head .flag { font-size: 34px; line-height: 1; }
  .team-head .names { flex: 1 1 auto; }
  .team-head .names .en { font-size: 18px; font-weight: 700; }
  .team-head .names .jp { color: var(--muted); font-size: 13px; }
  .team-head .badges { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .badge { font-size: 11px; padding: 3px 8px; border-radius: 999px; background: #233042; color: var(--accent); white-space: nowrap; }
  .badge.grp { background: #2a2340; color: var(--accent2); }
  .badge.rank { background: #1f3326; color: var(--mf); }
  .team-meta { padding: 0 18px 6px; color: var(--muted); font-size: 12.5px; }
  .team-note { padding: 4px 18px 12px; color: #b9c6d2; font-size: 12.5px; border-bottom: 1px dashed var(--border); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(255px, 1fr)); gap: 12px; padding: 14px 18px 18px; }
  .empty { padding: 16px 18px 22px; color: var(--muted); font-size: 13px; }

  /* Player card */
  .card { border: 1px solid var(--border); border-radius: 12px; background: var(--panel2); padding: 12px 13px; position: relative; transition: .15s; }
  .card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .card .top { display: flex; align-items: center; gap: 9px; }
  .num { width: 30px; height: 30px; flex: 0 0 auto; display: grid; place-items: center; border-radius: 8px;
    background: #0e1420; font-weight: 800; font-size: 13px; color: var(--text); border: 1px solid var(--border); }
  .pos { font-size: 10.5px; font-weight: 800; padding: 2px 7px; border-radius: 6px; color: #08121b; }
  .pos.GK { background: var(--gk);} .pos.DF{ background: var(--df);} .pos.MF{ background: var(--mf);} .pos.FW{ background: var(--fw);}
  .pname { margin-top: 9px; }
  .pname .en { font-weight: 700; font-size: 14.5px; }
  .pname .jp { color: var(--muted); font-size: 12px; }
  .club { margin-top: 7px; font-size: 12.5px; color: #cdd8e3; }
  .club .lbl { color: var(--muted); }
  .stats { display: flex; gap: 6px; margin-top: 9px; flex-wrap: wrap; }
  .pill { font-size: 10.5px; background: #0e1420; border: 1px solid var(--border); border-radius: 6px; padding: 2px 7px; color: var(--muted); }
  .pill b { color: var(--text); }
  .traits { margin-top: 9px; font-size: 12px; color: #b9c6d2; border-top: 1px dashed var(--border); padding-top: 8px; }

  mark { background: rgba(63,182,255,.35); color: #fff; border-radius: 3px; padding: 0 1px; }
  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 30px 16px; }
  .toggleAll { margin-left: auto; font-size: 12px; color: var(--accent); cursor: pointer; }
  .collapsed .grid, .collapsed .team-meta, .collapsed .team-note, .collapsed .empty { display: none; }
</style>
</head>
<body>
<header class="hero">
  <h1>🏆 FIFA ワールドカップ 2026 選手名鑑</h1>
  <div class="sub">World Cup 2026 Player Almanac &mdash; United States · Canada · Mexico</div>
  <div class="meta" id="meta"></div>
  <div class="disclaimer" id="disclaimer"></div>
</header>

<div class="wrap">
  <div class="controls">
    <div class="row">
      <input id="search" type="search" placeholder="🔍 選手名・所属・国名で検索 (例: 久保, Messi, Liverpool, ブラジル)…" autocomplete="off">
      <select id="confFilter"><option value="">全大陸</option></select>
      <select id="groupFilter"><option value="">全グループ</option></select>
      <select id="sortBy">
        <option value="default">並び: 背番号順</option>
        <option value="caps">並び: 代表キャップ多い順</option>
        <option value="goals">並び: 代表ゴール多い順</option>
        <option value="age">並び: 年齢若い順</option>
      </select>
      <span class="toggleAll" id="toggleAll">すべて展開/折りたたみ</span>
    </div>
    <div class="chips" id="posChips">
      <span class="chip active" data-pos="">全ポジション</span>
      <span class="chip" data-pos="GK">GK</span>
      <span class="chip" data-pos="DF">DF</span>
      <span class="chip" data-pos="MF">MF</span>
      <span class="chip" data-pos="FW">FW</span>
    </div>
    <div class="stat-line" id="statLine"></div>
  </div>

  <div id="teams"></div>
</div>

<footer>
  データは best-effort（2026年5月各協会発表 + 公開情報）。<code>data.js</code> を編集して選手・スタッツを追記できます。<br>
  Generated for World Cup 2026 · 全48カ国
</footer>

<script src="data.js"></script>
<script>
(function () {
  const D = window.WC_DATA;
  const state = { q: "", pos: "", conf: "", group: "", sort: "default", collapsed: false };

  // --- header meta ---
  document.getElementById("meta").textContent =
    `${D.meta.tournament_jp}　|　${D.meta.dates}　|　全${D.meta.teams_count}カ国`;
  document.getElementById("disclaimer").textContent = "⚠️ " + D.meta.disclaimer;

  // --- populate filters ---
  const confSel = document.getElementById("confFilter");
  Object.entries(D.confederations).forEach(([k, v]) => {
    const o = document.createElement("option"); o.value = k; o.textContent = v.jp; confSel.appendChild(o);
  });
  const groupSel = document.getElementById("groupFilter");
  [...new Set(D.teams.map(t => t.group))].sort().forEach(g => {
    const o = document.createElement("option"); o.value = g; o.textContent = "グループ " + g; groupSel.appendChild(o);
  });

  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  function hl(text, q) {
    text = esc(text);
    if (!q) return text;
    try { return text.replace(new RegExp("(" + q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&") + ")", "gi"), "<mark>$1</mark>"); }
    catch (e) { return text; }
  }
  const num = v => (v === null || v === undefined || v === "") ? "—" : v;

  function playerMatches(p, q) {
    if (state.pos && p.pos !== state.pos) return false;
    if (!q) return true;
    const hay = [p.name_en, p.name_jp, p.club_en, p.club_jp, p.pos, p.traits].join(" ").toLowerCase();
    return hay.includes(q);
  }
  function teamMatchesText(t, q) {
    return [t.name_en, t.name_jp, t.nickname_en, t.nickname_jp, t.coach].join(" ").toLowerCase().includes(q);
  }

  function sortPlayers(players) {
    const arr = players.slice();
    switch (state.sort) {
      case "caps": arr.sort((a,b)=>(b.caps||0)-(a.caps||0)); break;
      case "goals": arr.sort((a,b)=>(b.goals||0)-(a.goals||0)); break;
      case "age": arr.sort((a,b)=>(a.age||999)-(b.age||999)); break;
      default: arr.sort((a,b)=>(a.number||999)-(b.number||999));
    }
    return arr;
  }

  function playerCard(p, q) {
    return `<div class="card">
      <div class="top">
        <div class="num">${num(p.number)}</div>
        <span class="pos ${esc(p.pos)}">${esc(p.pos)}</span>
      </div>
      <div class="pname">
        <div class="en">${hl(p.name_en, q)}</div>
        <div class="jp">${hl(p.name_jp, q)}</div>
      </div>
      <div class="club"><span class="lbl">所属:</span> ${hl(p.club_jp || p.club_en, q)}</div>
      <div class="stats">
        <span class="pill">代表 <b>${num(p.caps)}</b>試合</span>
        <span class="pill">得点 <b>${num(p.goals)}</b></span>
        <span class="pill">年齢 <b>${num(p.age)}</b></span>
        ${p.height_cm ? `<span class="pill"><b>${p.height_cm}</b>cm</span>` : ""}
        ${p.foot ? `<span class="pill">利足 <b>${esc(p.foot)}</b></span>` : ""}
      </div>
      ${p.traits ? `<div class="traits">${hl(p.traits, q)}</div>` : ""}
    </div>`;
  }

  function render() {
    const q = state.q.trim().toLowerCase();
    const host = document.getElementById("teams");
    host.innerHTML = "";
    let shownTeams = 0, shownPlayers = 0;

    D.teams.forEach(t => {
      if (state.conf && t.confederation !== state.conf) return;
      if (state.group && t.group !== state.group) return;

      const teamTextHit = q ? teamMatchesText(t, q) : false;
      // if team name matches, show all its players (respecting pos filter); else filter by player query
      let players = sortPlayers(t.players).filter(p =>
        playerMatches(p, teamTextHit ? "" : q)
      );
      // pos filter still applies even when team text matches
      if (teamTextHit && state.pos) players = players.filter(p => p.pos === state.pos);

      const hasQuery = q.length > 0;
      if (hasQuery && players.length === 0 && !teamTextHit) return;

      shownTeams++; shownPlayers += players.length;

      const conf = (D.confederations[t.confederation] || {}).jp || t.confederation;
      const sec = document.createElement("section");
      sec.className = "team" + (state.collapsed ? " collapsed" : "");
      sec.innerHTML = `
        <div class="team-head">
          <span class="flag">${t.flag}</span>
          <div class="names">
            <div class="en">${hl(t.name_en, q)}</div>
            <div class="jp">${hl(t.name_jp, q)} ${t.nickname_jp ? "・" + hl(t.nickname_jp, q) : ""}</div>
          </div>
          <div class="badges">
            <span class="badge grp">Group ${t.group}</span>
            <span class="badge">${conf}</span>
            ${t.fifa_rank ? `<span class="badge rank">FIFA #${t.fifa_rank}</span>` : ""}
          </div>
        </div>
        <div class="team-meta">監督: ${esc(t.coach || "—")}　|　登録: ${t.players.length}名${players.length !== t.players.length ? `（表示 ${players.length}名）` : ""}</div>
        ${t.note ? `<div class="team-note">${hl(t.note, q)}</div>` : ""}
        ${players.length
          ? `<div class="grid">${players.map(p => playerCard(p, teamTextHit ? "" : q)).join("")}</div>`
          : `<div class="empty">この国の選手データは未登録です。<code>data.js</code> の "${esc(t.id)}" の players[] に追記してください。</div>`}
      `;
      sec.querySelector(".team-head").addEventListener("click", () => sec.classList.toggle("collapsed"));
      host.appendChild(sec);
    });

    document.getElementById("statLine").textContent =
      `表示中: ${shownTeams} カ国 / ${shownPlayers} 選手` + (q ? `　（検索: "${state.q}"）` : "");
  }

  // --- events ---
  document.getElementById("search").addEventListener("input", e => { state.q = e.target.value; render(); });
  confSel.addEventListener("change", e => { state.conf = e.target.value; render(); });
  groupSel.addEventListener("change", e => { state.group = e.target.value; render(); });
  document.getElementById("sortBy").addEventListener("change", e => { state.sort = e.target.value; render(); });
  document.querySelectorAll("#posChips .chip").forEach(c => {
    c.addEventListener("click", () => {
      document.querySelectorAll("#posChips .chip").forEach(x => x.classList.remove("active"));
      c.classList.add("active"); state.pos = c.dataset.pos; render();
    });
  });
  document.getElementById("toggleAll").addEventListener("click", () => {
    state.collapsed = !state.collapsed; render();
  });

  render();
})();
</script>
</body>
</html>
