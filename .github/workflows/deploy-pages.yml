name: Deploy World Cup 2026 Almanac to GitHub Pages

# 静的サイト (index.html + data.js) を GitHub Pages へ自動デプロイします。
# 初回のみ、リポジトリの Settings → Pages → "Build and deployment" の
# Source を「GitHub Actions」に設定してください（このワークフローが自動で
# 有効化を試みますが、組織設定によっては手動切替が必要です）。

on:
  push:
    branches:
      - main
      - claude/quirky-rubin-PwTlh
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時実行は最新のみ（進行中のデプロイはキャンセルしない）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # リポジトリ直下を丸ごと公開（index.html がエントリ）
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
